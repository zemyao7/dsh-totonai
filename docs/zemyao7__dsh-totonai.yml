description:
  en: "Account-based access to the ToTonAI gateway inside DeepSeek Harness: sign in or register in the settings panel, browse the site's text-model catalog (GPT, Claude, Gemini, DeepSeek, Doubao, Grok, GLM) and access the account recharge panel. Upstream API keys stay on the server."
  zh: "在 DeepSeek Harness 里用账号接入 ToTonAI 中转站:设置面板里登录或注册,查看站点文本模型目录(GPT、Claude、Gemini、DeepSeek、豆包、Grok、GLM),并可在同一面板查看会员档位与提交充值申报。上游 API Key 只留在服务器上。"
